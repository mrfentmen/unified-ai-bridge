name: Rust and extension checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Exercise real temporary workspace
        run: cargo run --locked -p bridge-native -- selftest

  package:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Isolate installation paths
        run: |
          echo "UAB_HOME=$RUNNER_TEMP/uab-home" >> "$GITHUB_ENV"
          echo "UAB_NATIVE_HOSTS_DIR=$RUNNER_TEMP/uab-native-hosts" >> "$GITHUB_ENV"
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.99.1
          cargo install --locked --git https://github.com/0xsouravm/oxichrome --rev f36ed22c007541e47308904ee925e21aa544e431 cargo-oxichrome
      - name: Initialize isolated configuration
        run: cargo run --locked -p bridge-native -- setup --project "$RUNNER_TEMP/uab-workspace"
      - name: Build, verify versions and install in isolation
        run: cargo bridge-deploy
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$("$UAB_HOME/bin/unified-ai-bridge-native" --version | cut -d ' ' -f 2)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Package extension
        working-directory: crates/bridge-extension/dist
        run: zip -r "$GITHUB_WORKSPACE/unified-ai-bridge-chromium.zip" chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-extension
          path: unified-ai-bridge-chromium.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish patch release after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Unified AI Bridge $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
