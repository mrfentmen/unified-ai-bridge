[workspace]
resolver = "2"
members = [
    "crates/bridge-core",
    "crates/bridge-native",
    "crates/bridge-extension",
    "crates/bridge-tooling",
]
default-members = ["crates/bridge-core", "crates/bridge-native", "crates/bridge-tooling"]

[workspace.package]
version = "0.4.6"
edition = "2021"
license = "MIT"
authors = ["Unified AI Bridge"]
repository = "https://github.com/mrfentmen/unified-ai-bridge"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
fs2 = "0.4"
hex = "0.4"
leptos = { version = "0.8.15", features = ["csr"] }
oxichrome = { git = "https://github.com/0xsouravm/oxichrome", rev = "f36ed22c007541e47308904ee925e21aa544e431" }
png = "0.18"
rand = "0.8"
rmcp = { version = "3.10.0", features = ["server", "client", "transport-child-process", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process", "fs"] }
toml = "0.8"
url = "2.5"
walkdir = "2"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = "0.3.85"
js-sys = "0.3.85"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
