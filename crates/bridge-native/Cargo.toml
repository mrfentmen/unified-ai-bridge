[package]
name = "bridge-native"
description = "Native messaging host, sandboxed tool backend, and MCP server for Unified AI Bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "unified-ai-bridge-native"

[[bin]]
name = "unified-ai-bridge-native"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bridge-core = { path = "../bridge-core" }
chrono.workspace = true
clap.workspace = true
csv.workspace = true
fs2.workspace = true
hex.workspace = true
libc = "0.2"
rand.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
walkdir.workspace = true
globset = "0.4"
similar = "2.7"
jsonschema = {version="0.33",default-features=false}
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
unicode-normalization = "0.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

syn = { version = "=2.0.119", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
roxmltree = "=0.21.1"
calamine = { version = "=0.38.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGContext", "CGColorSpace", "CGImage", "CGPDFPage", "CGAffineTransform"] }

[dev-dependencies]
tempfile.workspace = true
png.workspace = true
