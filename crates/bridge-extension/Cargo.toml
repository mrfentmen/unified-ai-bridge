[package]
name = "bridge-extension"
version = "0.5.32"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge-core = { path = "../bridge-core" }
base64.workspace = true
sha2.workspace = true
hex.workspace = true
oxichrome.workspace = true
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Location", "Document", "Element", "HtmlElement", "HtmlTextAreaElement",
    "HtmlInputElement", "Node", "NodeList", "MutationObserver",
    "MutationObserverInit", "MutationRecord", "KeyboardEvent", "MouseEvent",
    "Event", "EventTarget", "DomRect", "ShadowRoot", "ShadowRootInit",
    "ShadowRootMode", "CssStyleDeclaration", "Selection", "Range", "InputEvent",
    "EventInit", "KeyboardEventInit", "HtmlDocument", "ScrollToOptions", "Navigator", "Clipboard",
    "DataTransfer", "DataTransferItemList", "DataTransferItem", "File", "FileList", "FilePropertyBag", "Blob", "HtmlImageElement"
] }
console_error_panic_hook = "0.1"
